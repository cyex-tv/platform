# Licence and advisory checks (ADR 0007). Run with `cargo deny check`.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Each ignore names why it is safe and when to look again.
ignore = [
    # `paste` is unmaintained, not vulnerable. It only enters through utoipa-axum, as a
    # compile-time macro. Drop this once utoipa-axum moves off it.
    { id = "RUSTSEC-2024-0436", reason = "unmaintained compile-time macro, via utoipa-axum only" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Licences compatible with AGPL-3.0. Add one only with a note in ADR 0007.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    # Mozilla's CA certificate data (webpki-root-certs, via rustls-platform-verifier). A
    # permissive data licence with no copyleft; see ADR 0007.
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]

[licenses.private]
# Our own crates are AGPL-3.0-only and never published.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
