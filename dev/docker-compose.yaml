# Local development only. Ports bind to 127.0.0.1; the passwords are dev placeholders.
#   docker compose -f dev/docker-compose.yaml up -d
name: cyex-tv-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cyextv
      POSTGRES_USER: cyextv
      POSTGRES_PASSWORD: cyextv-dev-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyextv -d cyextv"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible stand-in for Cloudflare R2 (ADR 0003). Used from Phase 3 on.
  # Pinned to a release that still ships an image; check the tag on first use.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cyextv
      MINIO_ROOT_PASSWORD: cyextv-dev-only
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

volumes:
  pg-data:
  minio-data:
