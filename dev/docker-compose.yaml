# Local development only. Ports bind to 127.0.0.1; the passwords are dev placeholders.
#   docker compose -f dev/docker-compose.yaml up -d
name: cyex-tv-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cyextv
      POSTGRES_USER: cyextv
      POSTGRES_PASSWORD: cyextv-dev-only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cyextv -d cyextv"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S3-compatible stand-in for Cloudflare R2 (ADR 0003). MinIO stopped publishing images in
  # 2026, so this is Versity Gateway on a plain directory. S3 API on 127.0.0.1:9000.
  s3:
    image: versity/versitygw:v1.10.0
    environment:
      ROOT_ACCESS_KEY: cyextv
      ROOT_SECRET_KEY: cyextv-dev-only
      VGW_BACKEND: posix
      VGW_BACKEND_ARG: /data
    ports:
      - "127.0.0.1:9000:7070"
    volumes:
      - s3-data:/data

volumes:
  pg-data:
  s3-data:
