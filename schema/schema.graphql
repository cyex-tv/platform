	"""
	`#RRGGBB` or `#RRGGBBAA`.
	"""
	color: String!
}

"""
One colour stop of a gradient paint.
"""
input PaintStopInput {
	"""
	Where along the gradient, 0 to 1. Each stop is at or after the one before.
	"""
	at: Float!
	"""
