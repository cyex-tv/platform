	kind: CosmeticKind!
	cosmeticId: String!
	source: EntitlementSource!
	reason: String
	grantedBy: AccountSummary
	grantedAt: String!
}

"""
One badge, paint or role an account holds or held, and where it came from: one edge of the
entitlement graph.
