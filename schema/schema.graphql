	hideEmote(id: String!): Boolean!
	"""
	Show an emote you hid again. False when it wasn't hidden.
	"""
	unhideEmote(id: String!): Boolean!
	"""
	Hide every emote by a creator from your own view. True when newly hidden. `not_found` for
