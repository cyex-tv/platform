<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#08090c" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#08090c" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="preload" href="/fonts/geist-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      (function () {
        try {
          if (localStorage.getItem('cyexTheme') === 'light') {
            document.documentElement.dataset.theme = 'light';
            // The status bar follows the site's theme, not the OS one.
            document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute('content', '#ffffff'); });
          }
        } catch (e) {}
        // Signed in last time on this device (the layout keeps it current): pages with a signed-in
        // column (the browse page's set rail and tray) hold its place from the first paint.
        try {
          if (localStorage.getItem('cyexSigned') === '1') document.documentElement.dataset.signed = '';
          // Your own profile (by the account last signed in here): its owner buttons keep their row.
          var mine = localStorage.getItem('cyexMe');
          if (mine && location.pathname === '/users/' + mine) document.documentElement.dataset.own = '';
          // Your roles show only to you: on your profile and the /me pages under it, their line is held.
          if (mine && (location.pathname === '/users/' + mine || location.pathname.indexOf('/me/') === 0) && localStorage.getItem('cyexOwnFlags') === '1')
            document.documentElement.dataset.ownFlags = '';
          // A live announcement seen last time and not closed: prerendered pages hold the bar's place.
          var ann = localStorage.getItem('cyexAnnounce');
          if (ann && (localStorage.getItem('cyex.announcement.closed') || '').indexOf('"' + ann + '"') < 0) document.documentElement.dataset.announce = '';
          if (localStorage.getItem('cyex.browse.tray') === '0') document.documentElement.dataset.tray = 'shut';
        } catch (e) {}
        // Reduced motion, per device (Settings → Appearance): "reduce" or "full" override the OS.
        // Scripts ask matchMedia('(prefers-reduced-motion: …)'); the answer follows the setting.
        try {
          var motion = localStorage.getItem('cyexMotion');
          if (motion === 'reduce' || motion === 'full') document.documentElement.dataset.motion = motion;
        } catch (e) {}
        var nativeMatch = window.matchMedia && window.matchMedia.bind(window);
        if (nativeMatch) {
          var lists = [];
          window.matchMedia = function (q) {
            var list = nativeMatch(q);
            if (!/prefers-reduced-motion/.test(String(q))) return list;
            var wantsReduce = /reduce/.test(String(q));
            try {
              Object.defineProperty(list, 'matches', { configurable: true, get: function () {
                var pref = document.documentElement.dataset.motion;
                if (pref === 'reduce') return wantsReduce;
                if (pref === 'full') return !wantsReduce;
                return nativeMatch(q).matches;
              } });
            } catch (e) {}
            // Held weakly: a component's list goes once it is gone (a plain array kept every one).
            lists.push(typeof WeakRef === 'function' ? new WeakRef(list) : { deref: function () { return list; } });
            if (lists.length > 64) lists = lists.filter(function (r) { return r.deref(); });
            return list;
          };
          // The setting changed: tell everyone listening, as the OS query would.
          window.addEventListener('cyexmotion', function () {
            lists = lists.filter(function (r) { return r.deref(); });
            lists.forEach(function (r) { var l = r.deref(); try { if (l) l.dispatchEvent(new Event('change')); } catch (e) {} });
          });
        }
        document.documentElement.classList.add('js');
        var fonts = document.getElementById('fonts');
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
