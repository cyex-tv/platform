<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#08090c" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#08090c" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="%sveltekit.assets%/favicon.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Loaded as "print" so it doesn't block the first paint; the script below switches it on
         (no inline onload: the CSP allows this one script by its hash, not event attributes). -->
    <link
      id="fonts"
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap"
      media="print"
    />
    <script>
      (function () {
        try {
          if (localStorage.getItem('cyexTheme') === 'light') {
            document.documentElement.dataset.theme = 'light';
            // The status bar follows the site's theme, not the OS one.
            document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) { m.setAttribute('content', '#ffffff'); });
          }
        } catch (e) {}
        // Reduced motion, per device (Settings → Appearance): "reduce" or "full" override the OS.
        // Scripts ask matchMedia('(prefers-reduced-motion: …)'); the answer follows the setting.
        try {
          var motion = localStorage.getItem('cyexMotion');
          if (motion === 'reduce' || motion === 'full') document.documentElement.dataset.motion = motion;
        } catch (e) {}
        var nativeMatch = window.matchMedia && window.matchMedia.bind(window);
        if (nativeMatch) {
          var lists = [];
          window.matchMedia = function (q) {
            var list = nativeMatch(q);
            if (!/prefers-reduced-motion/.test(String(q))) return list;
            var wantsReduce = /reduce/.test(String(q));
            try {
              Object.defineProperty(list, 'matches', { configurable: true, get: function () {
                var pref = document.documentElement.dataset.motion;
                if (pref === 'reduce') return wantsReduce;
                if (pref === 'full') return !wantsReduce;
                return nativeMatch(q).matches;
              } });
            } catch (e) {}
            lists.push(list);
            return list;
          };
          // The setting changed: tell everyone listening, as the OS query would.
          window.addEventListener('cyexmotion', function () {
            lists.forEach(function (l) { try { l.dispatchEvent(new Event('change')); } catch (e) {} });
          });
        }
        document.documentElement.classList.add('js');
        var fonts = document.getElementById('fonts');
        if (fonts) {
          if (fonts.sheet) fonts.media = 'all';
          else fonts.addEventListener('load', function () { fonts.media = 'all'; });
        }
      })();
    </script>
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap" />
    </noscript>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
