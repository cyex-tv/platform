[package]
name = "cyex-tv-api"
description = "The cyex.tv HTTP API at api.cyex.tv/v1"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "cyex-tv-api"
path = "src/main.rs"

[[bin]]
name = "openapi"
path = "src/bin/openapi.rs"

[[bin]]
name = "schema"
path = "src/bin/schema.rs"

[dependencies]
async-graphql.workspace = true
async-graphql-axum.workspace = true
async-trait.workspace = true
axum.workspace = true
bytes.workspace = true
chrono.workspace = true
cyex-tv-auth.workspace = true
cyex-tv-db.workspace = true
cyex-tv-hub.workspace = true
cyex-tv-media.workspace = true
cyex-tv-shared = { workspace = true, features = ["graphql"] }
cyex-tv-storage.workspace = true
futures-util.workspace = true
getrandom.workspace = true
hmac.workspace = true
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
tokio.workspace = true
tower-http.workspace = true
thiserror.workspace = true
tracing.workspace = true
utoipa.workspace = true
utoipa-axum.workspace = true
uuid.workspace = true

[dev-dependencies]
futures-util = { workspace = true, features = ["sink"] }
http-body-util.workspace = true
image = { workspace = true, features = ["gif", "png", "webp"] }
png = "0.18"
tower.workspace = true
tokio-tungstenite.workspace = true
url.workspace = true

[lints]
workspace = true
