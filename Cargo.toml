[workspace]
resolver = "3"
members = ["apps/api", "apps/events", "apps/worker", "crates/db", "crates/shared"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-only"
repository = "https://github.com/cyex-tv/platform"
publish = false

[workspace.dependencies]
cyex-tv-db = { path = "crates/db" }
cyex-tv-shared = { path = "crates/shared" }

# Keep both at the same minor: async-graphql-derive declares no rust-version, so a lower one
# can pair an old async-graphql with a new derive crate.
async-graphql = "7.2"
async-graphql-axum = "7.2"
axum = "0.8"
dotenvy = "0.15"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http-body-util = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["macros", "migrate", "postgres", "runtime-tokio"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
utoipa = "5"
utoipa-axum = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
