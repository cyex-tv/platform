[workspace]
resolver = "3"
members = ["apps/api", "apps/events", "apps/worker", "crates/auth", "crates/db", "crates/media", "crates/shared", "crates/storage"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "AGPL-3.0-only"
repository = "https://github.com/cyex-tv/platform"
publish = false

[workspace.dependencies]
cyex-tv-auth = { path = "crates/auth" }
cyex-tv-db = { path = "crates/db" }
cyex-tv-media = { path = "crates/media" }
cyex-tv-shared = { path = "crates/shared" }
cyex-tv-storage = { path = "crates/storage" }

# Keep both at the same minor: async-graphql-derive declares no rust-version, so a lower one
# can pair an old async-graphql with a new derive crate.
async-graphql = "7.2"
async-graphql-axum = "7.2"
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dotenvy = "0.15"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.3"
hmac = "0.12"
http-body-util = "0.1"
# Decoding only here; encoders come with the transcoder.
image = { version = "0.25", default-features = false, features = ["gif", "png", "webp"] }
reqwest = { version = "0.13", default-features = false, features = ["form", "http2", "json", "query", "rustls-no-provider"] }
# The ring provider, not aws-lc: aws-lc-sys carries the OpenSSL licence, which ADR 0007 doesn't allow.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "json", "macros", "migrate", "postgres", "runtime-tokio", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
ulid = { version = "1", features = ["uuid"] }
url = "2"
utoipa = "5"
utoipa-axum = "0.2"
uuid = "1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
