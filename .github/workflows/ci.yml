name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cyextv
          POSTGRES_USER: cyextv
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyextv -d cyextv"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CYEX_TV_TEST_DATABASE_URL: postgres://cyextv:ci-only@localhost:5432/cyextv
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release
      # Until Cargo.lock is committed, keep the resolved one so it can be added.
      - if: hashFiles('Cargo.lock') != '' && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: Cargo.lock

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Generate the spec
        run: |
          mkdir -p openapi
          cargo run -q -p cyex-tv-api --bin openapi > openapi/openapi.json
      - name: The committed spec must match the code
        run: |
          if [ -n "$(git status --porcelain openapi/)" ]; then
            echo "::error::openapi/openapi.json is out of date. Run: cargo run -q -p cyex-tv-api --bin openapi > openapi/openapi.json"
            git diff --stat openapi/ || true
            exit 1
          fi
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: openapi/openapi.json

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
