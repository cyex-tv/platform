name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cyextv
          POSTGRES_USER: cyextv
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyextv -d cyextv"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CYEX_TV_TEST_DATABASE_URL: postgres://cyextv:ci-only@localhost:5432/cyextv
      # MinIO, the S3 stand-in for R2 (ADR 0003). Same tag as dev/docker-compose.yaml.
      CYEX_TV_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      CYEX_TV_TEST_S3_ACCESS_KEY_ID: cyextv
      CYEX_TV_TEST_S3_SECRET_ACCESS_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v7
      # Service containers can't take a command, and MinIO needs `server /data`.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 127.0.0.1:9000:9000 \
            -e MINIO_ROOT_USER=cyextv -e MINIO_ROOT_PASSWORD=ci-only-secret \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:9000/minio/health/live && exit 0
            sleep 1
          done
          docker logs minio
          exit 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release
      # When a dependency change leaves Cargo.lock behind, keep the resolved one so it can be committed.
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: cargo-lock
          path: Cargo.lock

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Generate the GraphQL SDL and the OpenAPI spec
        run: |
          mkdir -p schema openapi
          cargo run -q -p cyex-tv-api --bin schema > schema/schema.graphql
          cargo run -q -p cyex-tv-api --bin openapi > openapi/openapi.json
      - name: The committed descriptions must match the code
        run: |
          if [ -n "$(git status --porcelain schema/ openapi/)" ]; then
            echo "::error::schema/schema.graphql or openapi/openapi.json is out of date. Regenerate with the schema and openapi binaries (see README)."
            git status --short schema/ openapi/
            exit 1
          fi
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: contract
          path: |
            schema/schema.graphql
            openapi/openapi.json

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
