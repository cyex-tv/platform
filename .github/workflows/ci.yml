name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    # A hung test fails the job instead of holding a runner for six hours.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cyextv
          POSTGRES_USER: cyextv
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyextv -d cyextv"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CYEX_TV_TEST_DATABASE_URL: postgres://cyextv:ci-only@localhost:5432/cyextv
      # Versity Gateway, the S3 stand-in for R2 (ADR 0003). Same tag as dev/docker-compose.yaml.
      CYEX_TV_TEST_S3_ENDPOINT: http://127.0.0.1:9000
      CYEX_TV_TEST_S3_ACCESS_KEY_ID: cyextv
      CYEX_TV_TEST_S3_SECRET_ACCESS_KEY: ci-only-secret
    steps:
      - uses: actions/checkout@v7
      # Started by hand: it needs its backend set, and the job's services can't take a command.
      - name: Start the S3 server
        run: |
          docker run -d --name s3 -p 127.0.0.1:9000:7070 \
            -e ROOT_ACCESS_KEY=cyextv -e ROOT_SECRET_KEY=ci-only-secret \
            -e VGW_BACKEND=posix -e VGW_BACKEND_ARG=/tmp \
            versity/versitygw:v1.10.0
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:9000/ && exit 0
            sleep 1
          done
          docker logs s3
          exit 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # Phase 5's load tests (PLAN.md): 5000 event WebSocket connections and 2000 GraphQL
  # subscriptions, ten topics each.
  load:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: cyextv
          POSTGRES_USER: cyextv
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cyextv -d cyextv"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CYEX_TV_TEST_DATABASE_URL: postgres://cyextv:ci-only@localhost:5432/cyextv
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run the load test
        run: |
          ulimit -n 65536 || ulimit -n
          cargo test --release -p cyex-tv-events --test load -- --ignored --nocapture
      - name: Run the GraphQL socket load test
        run: |
          ulimit -n 65536 || ulimit -n
          cargo test --release -p cyex-tv-api --test gql_load -- --ignored --nocapture
      # The hot reads at a larger deployment's size (100k emotes, 50k accounts, 20k channels):
      # each one's time with the old query and without the scale indexes, then as it is now.
      - name: Time the hot reads at full scale
        run: cargo test --release -p cyex-tv-db --test scale -- --ignored --nocapture

  # Phase 9: the service images build, and each binary in them runs.
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the images
        run: |
          for target in api events worker; do
            docker build --target "$target" -t "cyex-tv-$target:ci" .
          done
      - name: Each starts and asks for its config
        run: |
          for target in api events worker; do
            out=$(docker run --rm "cyex-tv-$target:ci" 2>&1 || true)
            echo "$target: $out"
            echo "$out" | grep -q "CYEX_TV_DATABASE_URL"
          done
      - name: The website's image serves pages
        run: |
          docker build -f apps/web/Dockerfile -t cyex-tv-web:ci .
          docker run -d --name web -p 3000:3000 -e PUBLIC_API_URL=http://127.0.0.1:9 cyex-tv-web:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:3000/developers > /dev/null && break; sleep 1; done
          curl -fsS http://127.0.0.1:3000/developers | grep -q "cyex.tv"
          # The home page stands without the API.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/)" = 200
          test "$(docker inspect --format '{{.Config.User}}' cyex-tv-web:ci)" = node
          docker rm -f web

  # The website (Phase 6): generated GraphQL types current, type check, unit tests, build.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - name: The generated GraphQL types match the schema and queries
        run: |
          npm run codegen
          if [ -n "$(git status --porcelain src/lib/gql)" ]; then
            echo "::error::apps/web/src/lib/gql is out of date. Run npm run codegen in apps/web."
            git diff --stat src/lib/gql
            exit 1
          fi
      - run: npm run check
      - run: npm test
      - run: npm run build

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release
      # When a dependency change leaves Cargo.lock behind, keep the resolved one so it can be committed.
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: cargo-lock
          path: Cargo.lock

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Generate the GraphQL SDL and the OpenAPI spec
        run: |
          mkdir -p schema openapi
          cargo run -q -p cyex-tv-api --bin schema > schema/schema.graphql
          cargo run -q -p cyex-tv-api --bin openapi > openapi/openapi.json
      - name: The committed descriptions must match the code
        run: |
          if [ -n "$(git status --porcelain schema/ openapi/)" ]; then
            echo "::error::schema/schema.graphql or openapi/openapi.json is out of date. Regenerate with the schema and openapi binaries (see README)."
            git status --short schema/ openapi/
            exit 1
          fi
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: contract
          path: |
            schema/schema.graphql
            openapi/openapi.json

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
